name: FPSA-Prime correctness

on:
  pull_request:
    paths:
      - "src/fpsa_prime/**"
      - "experiments/fpsa_prime/**"
      - "notebooks/FPSA_Prime_Verification.ipynb"
      - "tests/test_fpsa_prime_*.py"
      - ".github/workflows/fpsa-prime-ci.yml"
  push:
    branches:
      - fpsa-prime-v0
    paths:
      - "src/fpsa_prime/**"
      - "experiments/fpsa_prime/**"
      - "notebooks/FPSA_Prime_Verification.ipynb"
      - "tests/test_fpsa_prime_*.py"
      - ".github/workflows/fpsa-prime-ci.yml"

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile FPSA-Prime
        run: |
          python -m compileall -q src/fpsa_prime experiments/fpsa_prime tests/test_fpsa_prime_*.py
          python -m json.tool notebooks/FPSA_Prime_Verification.ipynb >/dev/null
      - name: Run correctness suite
        run: |
          python -m pytest tests/test_fpsa_prime_*.py -q
      - name: Run numerical verification and tiny training smoke
        run: |
          python -m experiments.fpsa_prime.verification \
            --output_dir results/verification_ci \
            --skip_tests \
            --run_training
      - name: Upload verification tables and plots
        uses: actions/upload-artifact@v4
        with:
          name: fpsa-prime-verification-${{ github.sha }}
          path: results/verification_ci
          if-no-files-found: error
          retention-days: 14
