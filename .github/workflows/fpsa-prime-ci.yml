name: FPSA-Prime correctness

on:
  pull_request:
    paths:
      - "src/fpsa_prime/**"
      - "experiments/fpsa_prime/**"
      - "tests/test_fpsa_prime_*.py"
      - ".github/workflows/fpsa-prime-ci.yml"
  push:
    branches:
      - fpsa-prime-v0
    paths:
      - "src/fpsa_prime/**"
      - "experiments/fpsa_prime/**"
      - "tests/test_fpsa_prime_*.py"
      - ".github/workflows/fpsa-prime-ci.yml"

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile FPSA-Prime
        run: |
          python -m compileall -q src/fpsa_prime experiments/fpsa_prime tests/test_fpsa_prime_*.py
      - name: Run correctness suite
        run: |
          python -m pytest tests/test_fpsa_prime_*.py -q
