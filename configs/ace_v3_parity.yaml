name: ace_v3_parity
seed: 0
data_seed: 1234
seq_len: 16
n_train: 20000
n_test: 4000
d_model: 64
num_heads: 4
beta_min: 0.2     # certified rho = 0.8
beta_max: 0.8
R: 3.0
g_max: 0.97
ffn_mult: 2.0
max_iter: 40      # rho^40 ~ 1.3e-4 < tol guaranteed
tol: 1.0e-3
neumann_steps: 20 # adjoint truncation <= rho^21/(1-rho) ~ 4.6e-3
steps: 3000
batch_size: 128
lr: 1.0e-3
weight_decay: 0.01
eval_every: 100
early_stop_acc: 0.9999
