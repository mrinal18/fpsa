<svg width="680" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>FPSA architecture</title>
<desc>FPSA fixed-point loop: embedding x feeds an anchored value memory and a weight-tied loop of LN, Q/K projections with RoPE, attention against anchored V, output projection with input injection and in-loop FFN, damped update, and a per-token residual convergence check producing z*.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="60" y="40" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Input tokens</text>
<line x1="210" y1="62" x2="256" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="34" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="365" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Embedding x</text>
<text x="365" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">re-injected every iteration</text>

<path d="M300 90 L300 130 L140 130 L140 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="170" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="188" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Value memory V</text>
<text x="140" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">W_V LN(x), anchored</text>

<rect x="270" y="112" width="370" height="468" rx="14" fill="none" stroke="#888780" stroke-width="0.7" stroke-dasharray="5 4"/>
<text x="290" y="134" font-size="12" fill="#5F5E5A">Fixed-point loop — damped Picard, weight-tied</text>

<line x1="420" y1="90" x2="420" y2="166" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="170" width="310" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="455" y="188" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">LN(z) → Q, K + RoPE</text>
<text x="455" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">spectral-normed projections</text>
<line x1="455" y1="226" x2="455" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M240 198 L262 198 L262 284 L296 284" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="256" width="310" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="455" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Attention(Q, K) · V</text>
<text x="455" y="292" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">learned temperature τ per head</text>
<line x1="455" y1="312" x2="455" y2="338" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="342" width="310" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="455" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">W_O → + x → FFN</text>
<text x="455" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">input injection, in-loop GELU</text>
<line x1="455" y1="398" x2="455" y2="424" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="428" width="310" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="455" y="446" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Damped update</text>
<text x="455" y="464" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">(1−α)·z_k + α·f(z_k)</text>
<line x1="455" y1="484" x2="455" y2="510" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="514" width="310" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="455" y="532" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">&#8214;&#916;z&#8214;/&#8214;z&#8214; &lt; tol ?</text>
<text x="455" y="550" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">no → iterate ↻ (k ≤ K) · yes → exit</text>
<line x1="455" y1="580" x2="455" y2="616" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="300" y="620" width="310" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="455" y="638" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">z* → LN → head</text>
<text x="455" y="656" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Neumann adjoint trains at z*</text>
</svg>
