# Implicit TRM on Maze-Hard 30x30. The inner loop stores no activations, so
# larger micro-batches fit than the TRM baseline at the same memory.
data_dir: data/maze-30x30-hard-1k-noaug
arch: itrm
epochs: 50000
eval_interval: 5000
global_batch_size: 768
micro_batch_size: 192
lr: 1.0e-4
puzzle_emb_lr: 1.0e-4
weight_decay: 1.0
puzzle_emb_weight_decay: 1.0
ema: true
H_cycles: 3
L_layers: 2
hidden_size: 512
num_heads: 8
pos_encodings: rope
halt_max_steps: 16
norm_style: pre
damping: 0.9
stepsize_decay: 0.9
decay_patience: 5
inner_tol: 1.0e-2
inner_max_iter: 16
inner_max_iter_eval: 64
grad_mode: neumann
adjoint_steps: 10
mask_nonconverged: true
spectral_norm: false
jacobian_reg_lambda: 0.0
residual_scale: true
alpha_1_init: 0.75
alpha_2_init: 0.25
