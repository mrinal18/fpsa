# CPU smoke test for the TRM baseline.
data_dir: data/sudoku-synthetic-small
arch: trm
epochs: 60
eval_interval: 30
global_batch_size: 32
lr: 3.0e-4
puzzle_emb_lr: 3.0e-4
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1
ema: true
hidden_size: 64
num_heads: 4
puzzle_emb_len: 4
H_cycles: 2
L_cycles: 4
L_layers: 2
halt_max_steps: 4
